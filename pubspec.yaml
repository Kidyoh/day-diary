name: day_diary
description: "Day Diary — a motion-first photo diary with timestamps."
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/samples/

  fonts:
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
